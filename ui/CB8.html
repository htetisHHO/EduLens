<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="css/style.css">

    <style>
        .screen{
            position:relative;
            width:336px;
            min-height:812px;
            margin:0 auto;
            overflow:hidden;
            background:#fff;
        }

        .settings-top{
            height:118px;
        }

        .title-bar{
            display:flex;
            justify-content:center;
            align-items:center;
            height:64px;
            padding:8px 20px 16px;
        }

        .title-bar h1{
            margin:0;
            color:#fff;
            font-size:20px;
        }

        .back-floating{
            position:absolute;
            top:46px;
            left:20px;
            z-index:100;
            background:transparent;
            border:0;
            padding:0;
            color:#fff;
            font-size:24px;
            cursor:pointer;
        }

        .profile-floating{
            position:absolute;
            top:42px;
            right:20px;
            z-index:100;
            background:transparent;
            border:0;
            padding:0;
            cursor:pointer;
        }

        .profile-floating img{
            width:36px;
            height:36px;
            display:block;
            border-radius:50%;
        }

        .settings-card{
            padding:12px 14px;
            margin-bottom:11px;
        }

        .setting b{
            font-size:14px;
        }

        .setting small{
            display:block;
            color:#667085;
            font-size:10px;
            margin-top:3px;
        }

        .source-tags{
            display:flex;
            flex-wrap:wrap;
            gap:7px;
            margin-top:10px;
        }

        .save{
            float:right;
            color:#13a873;
            font-size:11px;
        }
    </style>
</head>

<body>

<div class="screen">

    <button class="back-floating" onclick="goBack()">←</button>

    <button class="profile-floating" onclick="goProfile()">
        <img src="images/EduLens-logo.png" alt="EduLens logo">
    </button>

    <header class="top settings-top">
        <div class="status"></div>

        <div class="topbar title-bar">
            <h1>Settings</h1>
        </div>
    </header>

    <main class="page">

        <section class="card settings-card">

            <div class="section-label" style="margin-top:0">
                PREFERENCES
            </div>

            <div class="setting">
                <span class="setting-icon">☾</span>

                <span>
                    <b>Dark Mode</b>
                    <small>Use a darker interface</small>
                </span>

                <span class="toggle"></span>
            </div>

            <div class="setting">
                <span class="setting-icon">文</span>

                <span>
                    <b>Preferred Language</b>
                    <small>English</small>
                </span>

                <span style="margin-left:auto;font-size:22px;color:#667085;">›</span>
            </div>

            <div class="setting">
                <span class="setting-icon">♧</span>

                <span>
                    <b>Notification Settings</b>
                    <small>Analysis updates enabled</small>
                </span>

                <span class="toggle"></span>
            </div>

        </section>

        <section class="card settings-card">

            <div class="section-label" style="margin-top:0;">
                TRUSTED SOURCES
                <span class="save">♧ Saved</span>
            </div>

            <div class="source-tags">
                <span class="tag">✓ BBC</span>
                <span class="tag">✓ Reuters</span>
                <span class="tag">✓ WHO</span>
                <span class="tag">✓ NASA</span>
                <span class="tag">✓ Government Sites</span>

                <span class="tag" style="background:#f3f4f6;color:#667085;border-color:#e2e4e8;">
                    ⓘ Wikipedia · Background
                </span>
            </div>

        </section>

        <section class="card settings-card">

            <div class="setting" onclick="window.location.href='LearnMore.html'" style="cursor:pointer;">
                <span class="setting-icon" style="background:#eaf8f1;color:#13a873;">ⓘ</span>

                <span>
                    <b>About the Project</b>
                    <small>EduLens AI · Version 1.0</small>
                </span>

                <span style="margin-left:auto;font-size:22px;color:#667085;">›</span>
            </div>

        </section>

    </main>

</div>

<script src="js/navigation.js"></script>

</body>
</html>
